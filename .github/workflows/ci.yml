name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # tests never touch this - they use an in-memory SQLite db (see tests/conftest.py) -
      # but importing the app requires the setting to exist at all, since it has no default.
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost/unused
      JWT_SECRET: ci-only-secret-not-a-real-deployment-value-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
